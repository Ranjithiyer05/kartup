{% extends "base.html" %}
{% block head %}<meta name="description" content="kartup">{% endblock %}
{% block body %}
<main class="shell">
  <section class="card" aria-labelledby="brand-title">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><path d="M16 3l3.6 8.4L28 15l-8.4 3.6L16 27l-3.6-8.4L4 15l8.4-3.6z" fill="currentColor"/></svg>
      </span>
      <h1 id="brand-title">kart<span class="accent">up</span></h1>
    </header>

    <form id="submission-form" class="form" action="/api/submissions" method="post" novalidate>
      <div class="field">
        <label for="name">Email</label>
        <input id="name" name="name" type="text" autocomplete="given-name" maxlength="100"
               autocapitalize="words" autocorrect="off" enterkeyhint="next"
               required aria-describedby="name-error" spellcheck="false">
        <p class="field-error" id="name-error" role="alert" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="surname">Password</label>
        <input id="surname" name="surname" type="text" autocomplete="family-name" maxlength="100"
               autocapitalize="words" autocorrect="off" enterkeyhint="done"
               required aria-describedby="surname-error" spellcheck="false">
        <p class="field-error" id="surname-error" role="alert" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <span class="btn-label">Submit</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <div class="notice" id="form-status" role="status" aria-live="polite" tabindex="-1" hidden></div>
    </form>
  </section>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
{% endblock %}
